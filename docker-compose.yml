services:
  backend:
    build:
      context: .
      target: development

    container_name: job-board-backend

    ports:
      - "3002:3000"

    env_file:
      - .env.docker

    depends_on:
      - mongodb
      - redis

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

    command: sh -c "npm install && npm run start:dev"

  mongodb:
    image: mongo:7

    container_name: job-board-mongodb

    ports:
      - "27020:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine

    container_name: job-board-redis

    ports:
      - "6381:6379"

volumes:
  mongodb_data:
  backend_node_modules:
